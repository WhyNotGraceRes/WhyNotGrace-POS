# Explicit rather than relying on the base image's compiled-in default —
# the master process starts as root (needed to bind port 80) and drops
# worker processes to this unprivileged user; this custom nginx.conf
# replaces the official image's own nginx.conf entirely (including its
# `user nginx;` line), so it must be restated here rather than assumed.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" '
                     '$status $body_bytes_sent rt=$request_time '
                     'uct="$upstream_connect_time" urt="$upstream_response_time" '
                     'upstream="$upstream_addr"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 2m;

    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 512;

    # Docker Compose's embedded DNS server (always 127.0.0.11 inside a
    # container on a user-defined network). Needed for the `resolve`
    # parameter below to re-resolve "backend" as replicas are added or
    # removed via `docker compose up -d --scale backend=N`.
    resolver 127.0.0.11 valid=5s;

    # --- Backend upstream pool -------------------------------------------
    # `resolve` (open-source nginx since 1.27.3 — this image is pinned to
    # 1.27.4+, see the Dockerfile-equivalent `image:` tag in
    # docker-compose.prod.yml) makes nginx re-resolve "backend" against
    # Docker's DNS periodically (per `resolver ... valid=5s`) and expand it
    # into one peer per resolved IP — i.e. one peer per running replica —
    # updating the peer list automatically as replicas are added/removed,
    # entirely in open-source nginx, no commercial license needed.
    #
    # This does NOT give health-aware DNS: verified against nginx/Docker
    # docs that Docker's embedded DNS returns every replica's IP
    # regardless of its HEALTHCHECK status in plain (non-swarm) Compose —
    # unlike Swarm's routing mesh, it does not filter unhealthy containers
    # out of the answer. The actual failover here is nginx's own PASSIVE
    # health tracking: `max_fails`/`fail_timeout` below mark a peer
    # temporarily unavailable after real proxy-level failures (connection
    # refused, timeout, 502/503/504 — see proxy_next_upstream), independent
    # of Docker. A replica that's failing its own HEALTHCHECK will also be
    # failing real requests, so nginx routes around it within
    # `max_fails` requests regardless of what Docker's DNS reports.
    upstream backend_pool {
        zone backend_pool 64k;
        server backend:8000 resolve max_fails=2 fail_timeout=10s;
        keepalive 32;
    }

    # Defense-in-depth only — app/core/rate_limit.py's slowapi limiter is
    # the real, endpoint-aware limit (30/min on QR scan, 20/min on QR
    # order placement, etc.). This just caps how much any single client IP
    # can throw at the edge before reaching a backend replica at all.
    limit_req_zone $binary_remote_addr zone=edge_general:10m rate=50r/s;
    limit_req_status 429;

    server {
        listen 80;
        server_name _;

        # Baseline hardening headers, matching the frontend's and the
        # backend's own SecurityHeadersMiddleware (app/main.py) so nothing
        # in this stack ships weaker defaults than the app itself.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Real TLS termination belongs at a managed cloud load balancer
        # (ALB/GCP LB/Cloudflare) placed in front of this container in a
        # real deployment — automated certificate rotation and DDoS
        # absorption are not worth hand-rolling here. If you must
        # terminate TLS on this box directly instead, add a
        # `listen 443 ssl;` server block with ssl_certificate /
        # ssl_certificate_key pointing at real files mounted read-only
        # (never baked into the image), and redirect this :80 block to it.

        limit_req zone=edge_general burst=100 nodelay;

        location /health {
            # Liveness probe traffic — keep it out of the access log noise.
            access_log off;
            proxy_pass http://backend_pool;
        }

        location / {
            proxy_pass http://backend_pool;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # A peer that's actually down should fail fast onto the next
            # one in backend_pool rather than hang a client for the full
            # request timeout.
            proxy_connect_timeout 3s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
        }
    }
}
