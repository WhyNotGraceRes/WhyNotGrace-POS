; PgBouncer configuration for the production docker-compose overlay
; (docker-compose.prod.yml). Sits between every backend replica and the
; real Postgres server, in TRANSACTION pooling mode: a real Postgres
; backend connection is only held for the duration of one transaction,
; then immediately returned to PgBouncer's pool for the next waiting
; client. This is what decouples "how many backend replicas/workers we
; run" from "how many connections Postgres allows" — see
; backend/README.md's "Scaling beyond one process" section for the exact
; connection-count math this enables.
;
; Every backend replica's DATABASE_URL points here (pgbouncer:6432), never
; directly at postgres:5432, in the production overlay.

[databases]
; Wildcard entry: proxy any requested database name straight through to
; the same-named database on the real Postgres host, so this file never
; needs to hardcode POSTGRES_DB and stays correct regardless of what the
; operator names their database.
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; See userlist.txt.example for how real credentials get here — never
; commit a real userlist.txt (it is gitignored; this ini only references
; its mount path).
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; TRANSACTION mode is required for the connection-count decoupling above.
; Known tradeoff: session-level state (SET, LISTEN/NOTIFY, advisory locks
; held across statements, server-side prepared statements) cannot be
; relied on across a transaction boundary, because the next transaction
; may land on a different real connection. This app already accounts for
; the one instance of this that matters to it: both SQLAlchemy engines in
; app/database/session.py set prepare_threshold=None specifically so
; psycopg3 never creates server-side prepared statements in the first
; place. Nothing else in this codebase relies on cross-transaction session
; state (no LISTEN/NOTIFY, no explicitly held advisory locks).
pool_mode = transaction

; How many CLIENT (app-side) connections PgBouncer itself will accept in
; total, across every backend replica combined. Each backend replica's own
; SQLAlchemy pool (DB_POOL_SIZE+DB_POOL_MAX_OVERFLOW for staff routes,
; QR_DB_POOL_SIZE+QR_DB_POOL_MAX_OVERFLOW for QR routes) counts against
; this. Cheap to raise — these are lightweight PgBouncer-side connections,
; not real Postgres backends.
max_client_conn = 2000

; How many REAL Postgres backend connections PgBouncer keeps open per
; database, reused across all waiting clients. This is the number that
; actually counts against Postgres's max_connections (default 100) — see
; README for the exact math. 25 leaves comfortable headroom under the
; default max_connections=100 even with psql/migrations/other clients
; also connecting directly.
default_pool_size = 25
min_pool_size = 0
; Extra connections PgBouncer may briefly open above default_pool_size
; during a burst, on top of the reserve_pool_timeout wait below.
reserve_pool_size = 10
reserve_pool_timeout = 3

server_idle_timeout = 60
server_lifetime = 3600
server_login_retry = 3
client_login_timeout = 60

log_connections = 1
log_disconnections = 1

; Lets an operator run `psql -h pgbouncer -p 6432 pgbouncer -c "SHOW POOLS;"`
; using the same credentials the app already uses. Change this if your
; real deployment's app DB user differs from POSTGRES_USER's default.
admin_users = whynotgrace
stats_users = whynotgrace
