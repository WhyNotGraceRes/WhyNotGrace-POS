server {
    # >1024 so the master process doesn't need root to bind it — see
    # Dockerfile, which runs nginx as a non-root user.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Baseline hardening headers, matching the backend's (see
    # backend/app/main.py:security_headers) so the frontend doesn't ship
    # weaker defaults than the API it talks to.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache-bust safe: Vite fingerprints built assets by content hash, so
    # long-lived caching is safe for everything except index.html itself.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing (react-router): any path that isn't a real file
    # falls back to index.html so deep links (e.g. /menu, /qr/menu/...)
    # don't 404 on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
